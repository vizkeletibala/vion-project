# Reference platform compose file copied from the repo's active stack.
# Use this as a starting point in another project, then rename hostnames,
# tighten security, and trim services you do not need.

services:
  traefik:
    image: traefik:v3.6.2
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --log.level=INFO
      - --log.format=json
      - --accesslog=true
      - --accesslog.format=json
      - --metrics.prometheus=true
      - --metrics.prometheus.addrouterslabels=true
      - --metrics.prometheus.addserviceslabels=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`${TRAEFIK_HOST:-traefik.vion.test}`)
      - traefik.http.routers.traefik.entrypoints=web
      - traefik.http.routers.traefik.service=api@internal
      - logging.enabled=true
      - logging.stack=${STACK_NAME:-vion}
      - logging.service=traefik
      - prometheus.scrape=true
      - prometheus.port=8080
      - prometheus.path=/metrics
    networks:
      - edge
      - internal

  registry:
    image: registry:2
    restart: unless-stopped
    environment:
      - REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY=/var/lib/registry
      - REGISTRY_HTTP_DEBUG_ADDR=0.0.0.0:5001
      - REGISTRY_HTTP_DEBUG_PROMETHEUS_ENABLED=true
      - REGISTRY_HTTP_DEBUG_PROMETHEUS_PATH=/metrics
    volumes:
      - registry-data:/var/lib/registry
    labels:
      - traefik.enable=true
      - traefik.http.routers.registry.rule=Host(`${REGISTRY_HOST:-registry.vion.test}`)
      - traefik.http.routers.registry.entrypoints=web
      - traefik.http.services.registry.loadbalancer.server.port=5000
      - logging.enabled=true
      - logging.stack=${STACK_NAME:-vion}
      - logging.service=registry
      - prometheus.scrape=true
      - prometheus.port=5001
      - prometheus.path=/metrics
    networks:
      - edge
      - internal

  jenkins:
    image: ${JENKINS_IMAGE:-registry.vion.test:80/vion/jenkins-docker:lts-jdk17}
    build:
      context: ./platform-stack/jenkins
    pull_policy: build
    restart: unless-stopped
    user: root
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${JENKINS_PORT:-8081}:8080"
    labels:
      - traefik.enable=true
      - traefik.http.routers.jenkins.rule=Host(`${JENKINS_HOST:-jenkins.vion.test}`)
      - traefik.http.routers.jenkins.entrypoints=web
      - traefik.http.services.jenkins.loadbalancer.server.port=8080
      - logging.enabled=true
      - logging.stack=${STACK_NAME:-vion}
      - logging.service=jenkins
    networks:
      - edge
      - internal

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    group_add:
      - "${DOCKER_GID:-988}"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./platform-stack/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - logging.enabled=true
      - logging.stack=${STACK_NAME:-vion}
      - logging.service=prometheus
    networks:
      - edge
      - internal

  grafana:
    image: grafana/grafana:11.1.4
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./platform-stack/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`${GRAFANA_HOST:-grafana.vion.test}`)
      - traefik.http.routers.grafana.entrypoints=web
      - traefik.http.services.grafana.loadbalancer.server.port=3000
      - logging.enabled=true
      - logging.stack=${STACK_NAME:-vion}
      - logging.service=grafana
    networks:
      - edge
      - internal

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./platform-stack/loki/loki-config.yaml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    labels:
      - logging.enabled=true
      - logging.stack=${STACK_NAME:-vion}
      - logging.service=loki
      - prometheus.scrape=true
      - prometheus.port=3100
      - prometheus.path=/metrics
    networks:
      - internal

  promtail:
    image: grafana/promtail:3.1.1
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./platform-stack/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yml:ro
      - promtail-positions:/var/lib/promtail
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - logging.enabled=true
      - logging.stack=${STACK_NAME:-vion}
      - logging.service=promtail
      - prometheus.scrape=true
      - prometheus.port=9080
      - prometheus.path=/metrics
    networks:
      - internal
    depends_on:
      - loki

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    pid: host
    volumes:
      - /:/host:ro
    command:
      - --path.rootfs=/host
    labels:
      - logging.enabled=true
      - logging.stack=${STACK_NAME:-vion}
      - logging.service=node-exporter
    networks:
      - internal

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "${CADVISOR_PORT:-8083}:8080"
    labels:
      - traefik.enable=true
      - traefik.http.routers.cadvisor.rule=Host(`${CADVISOR_HOST:-cadvisor.vion.test}`)
      - traefik.http.routers.cadvisor.entrypoints=web
      - traefik.http.services.cadvisor.loadbalancer.server.port=8080
      - logging.enabled=true
      - logging.stack=${STACK_NAME:-vion}
      - logging.service=cadvisor
    networks:
      - internal

  dnsmasq:
    image: 4km3/dnsmasq:2.90-r3
    restart: unless-stopped
    profiles:
      - dns
    cap_add:
      - NET_ADMIN
    command:
      - --no-daemon
      - --log-facility=-
      - --address=/${BASE_DOMAIN:-vion.test}/${LAN_IP:-127.0.0.1}
    ports:
      - "${DNS_PORT:-53}:53/udp"
      - "${DNS_PORT:-53}:53/tcp"
    labels:
      - logging.enabled=true
      - logging.stack=${STACK_NAME:-vion}
      - logging.service=dnsmasq
    networks:
      - edge

networks:
  edge:
  internal:

volumes:
  jenkins-home:
  registry-data:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-positions:
